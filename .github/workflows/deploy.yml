name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Upload frontend
        run: |
          rsync -avz --delete \
            --exclude 'server/' \
            --exclude '*.db' \
            --exclude '*.sqlite' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/erp-enoterra/enoterra_erp/deploy/"

      - name: Upload backend
        run: |
          rsync -avz \
            --exclude 'uploads/' \
            --exclude '*.db' \
            --exclude '*.sqlite' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/erp-enoterra/enoterra_erp/deploy/server/"

      - name: Install server deps and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/erp-enoterra/enoterra_erp/deploy/server
            chmod +x load-node-env.sh install-backup-cron.sh run-backup.sh
            # shellcheck source=/dev/null
            . ./load-node-env.sh
            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "node/npm not found after loading environment"
              command -v node || true
              command -v npm || true
              exit 1
            fi
            echo "Using node: $(command -v node) ($(node -v))"
            echo "Using npm: $(command -v npm) ($(npm -v))"
            npm install --omit=dev
            export NODE_ENV=production
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete enoterra-erp 2>/dev/null || true
              pm2 start index.js --name enoterra-erp --update-env
              pm2 save 2>/dev/null || true
            else
              echo "pm2 not found — restart Node.js app manually in Hostinger panel"
            fi
            ./install-backup-cron.sh
